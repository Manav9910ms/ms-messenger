<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MS Connect</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00c3ff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
</head>
<body>
  <div class="app">
    <div class="sidebar" id="sidebar">
      <div class="logo">MS Connect</div>

      <div class="profile">
        <img id="profilePic" src="favicon.png" alt="Profile picture">

        <div>
          <div id="profileName">Guest</div>
          <div id="profileUsername" class="profileUsername">@username</div>
          <div class="onlineText">Online</div>
        </div>
      </div>

      <button id="loginBtn">Sign In With Google</button>
      <button id="logoutBtn">Logout</button>

      <input type="text" id="searchInput" placeholder="Search users...">

      <div class="usersTitle">USERS</div>
      <div id="usersList"></div>
    </div>

    <div class="chatArea" id="chatArea">
      <div id="chatHeader">
        <button id="backBtn">Back</button>
        <div class="chatHeaderMain">
          <div id="chatUserName">Select User</div>
          <div id="chatUserStatus"></div>
        </div>
        <div class="callActions">
          <button id="voiceCallBtn" disabled>Voice Call</button>
          <button id="videoCallBtn" disabled>Video Call</button>
          <button id="endCallBtn" class="dangerBtn" style="display:none;">End Call</button>
        </div>
      </div>

      <div id="videoPanel" class="videoPanel">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay muted playsinline></video>
      </div>

      <div id="chatMessages"></div>

      <div class="messageBox">
        <input type="text" id="messageInput" placeholder="Type message...">
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>

  <div id="usernamePage" class="usernamePage">
    <div class="usernameCard">
      <h1>Create Username</h1>
      <p>Choose your public username</p>
      <input type="text" id="usernameInput" placeholder="@username">
      <button id="saveUsernameBtn">Continue</button>
    </div>
  </div>

  <div id="incomingCallModal" class="incomingCallModal">
    <div class="incomingCallCard">
      <h2 id="incomingCallTitle">Incoming Call</h2>
      <p id="incomingCallText">Someone is calling...</p>
      <div class="incomingCallActions">
        <button id="acceptCallBtn">Accept</button>
        <button id="rejectCallBtn" class="dangerBtn">Reject</button>
      </div>
    </div>
  </div>

  <audio id="remoteAudio" autoplay></audio>

  <script type="module" src="script.js"></script>
</body>
</html>
