<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#00c3ff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="MS Connect secure real-time messaging and calling app.">
  <meta name="application-name" content="MS Connect">
  <title>MS Connect</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <main class="app" aria-label="MS Connect messenger">
    <aside class="sidebar" id="sidebar">
      <div class="logo" aria-label="MS Connect">MS Connect</div>

      <section class="profile" aria-label="Your profile">
        <img id="profilePic" src="favicon.png" alt="Profile picture">
        <div>
          <div id="profileName">Guest</div>
          <div id="profileUsername" class="profileUsername">@username</div>
          <div class="onlineText" aria-label="Connection status">Online</div>
        </div>
      </section>

      <button id="loginBtn" type="button">Sign In With Google</button>
      <button id="logoutBtn" type="button">Logout</button>

      <label class="srOnly" for="searchInput">Search users</label>
      <input
        type="search"
        id="searchInput"
        placeholder="Search users..."
        autocomplete="off"
        enterkeyhint="search"
      >

      <div class="usersTitle">USERS</div>
      <div id="usersList" class="usersList" aria-live="polite"></div>
    </aside>

    <section class="chatArea" id="chatArea" aria-label="Chat">
      <header id="chatHeader">
        <button id="backBtn" type="button" aria-label="Back to users">Back</button>
        <div class="chatHeaderMain">
          <div id="chatUserName">Select User</div>
          <div id="chatUserStatus" aria-live="polite"></div>
        </div>
        <div class="callActions" aria-label="Call actions">
          <button id="voiceCallBtn" type="button" disabled>Voice Call</button>
          <button id="videoCallBtn" type="button" disabled>Video Call</button>
          <button id="endCallBtn" type="button" class="dangerBtn" hidden>End Call</button>
        </div>
      </header>

      <div id="videoPanel" class="videoPanel" aria-label="Video call">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay muted playsinline></video>
      </div>

      <div id="chatMessages" aria-live="polite" aria-label="Messages"></div>

      <form class="messageBox" id="messageForm">
        <label class="srOnly" for="messageInput">Message</label>
        <input
          type="text"
          id="messageInput"
          placeholder="Type message..."
          maxlength="4000"
          autocomplete="off"
          enterkeyhint="send"
        >
        <button id="sendBtn" type="submit">Send</button>
      </form>
    </section>
  </main>

  <section id="usernamePage" class="usernamePage" aria-modal="true" aria-labelledby="usernameTitle">
    <div class="usernameCard">
      <h1 id="usernameTitle">Create Username</h1>
      <p>Choose your public username</p>
      <label class="srOnly" for="usernameInput">Username</label>
      <input
        type="text"
        id="usernameInput"
        placeholder="@username"
        minlength="3"
        maxlength="20"
        autocomplete="username"
        autocapitalize="none"
      >
      <button id="saveUsernameBtn" type="button">Continue</button>
    </div>
  </section>

  <section id="incomingCallModal" class="incomingCallModal" aria-modal="true" aria-labelledby="incomingCallTitle">
    <div class="incomingCallCard">
      <h2 id="incomingCallTitle">Incoming Call</h2>
      <p id="incomingCallText">Someone is calling...</p>
      <div class="incomingCallActions">
        <button id="acceptCallBtn" type="button">Accept</button>
        <button id="rejectCallBtn" type="button" class="dangerBtn">Reject</button>
      </div>
    </div>
  </section>

  <div id="toastContainer" class="toastContainer" aria-live="assertive" aria-atomic="true"></div>
  <audio id="remoteAudio" autoplay></audio>

  <script type="module" src="script.js"></script>
</body>
</html>
